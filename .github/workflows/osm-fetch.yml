name: Fetch OpenStreetMap data

# Downloads everything OpenStreetMap has around the zoo (main API, map call) into data/osm/oasis.json and commits it to the branch it
# runs on. The app's paths are then rebuilt from it with
# scripts/osm-to-paths.py. Run it from the Actions tab.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download from the OpenStreetMap API
        run: |
          # left, bottom, right, top around the park (small area: allowed by the API)
          BBOX="-14.1760,28.1760,-14.1500,28.1920"
          mkdir -p data/osm
          curl -sSf --retry 3 --retry-delay 10 --max-time 180 \
            -A "OasisMap/1.0 (+https://github.com/SkylerBoy/OasisMap)" \
            "https://api.openstreetmap.org/api/0.6/map.json?bbox=${BBOX}" -o data/osm/oasis.json
          jq '{elements: (.elements | length), ways: ([.elements[] | select(.type=="way")] | length), timestamp: .timestamp}' data/osm/oasis.json

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/osm/oasis.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update OpenStreetMap data (data/osm/oasis.json)"
          git push
