<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#a71d2f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Oasis Wildlife Map</title>
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">
        <img src="/src/assets/logo-white.png" alt="Oasis Wildlife Fuerteventura" width="74" height="46" />
      </h1>
      <div class="top-actions">
        <a
          id="pdf-link"
          class="top-btn"
          href="https://wildapp.oasiswildlifefuerteventura.com/img/mapas/assets/mapa_es.pdf"
          target="_blank"
          rel="noopener"
          data-i18n-title="pdfMap"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
          <span>PDF</span>
        </a>
        <label class="lang">
          <span class="sr-only" data-i18n="language">Idioma</span>
          <span id="lang-code" class="lang-code" aria-hidden="true">ES</span>
          <select id="lang-select"></select>
        </label>
      </div>
    </header>

    <div id="status-banner" class="banner info" hidden></div>

    <section id="map-card" class="map-card">
      <div id="map"></div>

      <div id="nav-hud" class="nav-hud" hidden>
        <div class="hud-arrow-wrap">
          <svg id="hud-arrow" class="hud-arrow" viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 6 L84 88 L50 70 L16 88 Z" />
          </svg>
        </div>
        <div class="hud-text">
          <div id="hud-instruction" class="hud-instruction"></div>
          <div id="hud-meta" class="hud-meta"></div>
          <button id="hud-compass" class="hud-compass" type="button" hidden data-i18n="compass"></button>
        </div>
        <button id="hud-stop" class="hud-stop" type="button" data-i18n="stop">Parar</button>
      </div>

      <div class="map-controls">
        <button id="btn-expand" class="fab" type="button" data-i18n-title="map.expand"></button>
        <button id="btn-locate" class="fab" type="button" data-i18n-title="map.locate"></button>
        <button id="btn-layer" class="fab" type="button" data-i18n-title="layer.map"></button>
      </div>
    </section>

    <main id="browse" class="browse">
      <input id="search" class="search" type="search" autocomplete="off" data-i18n-placeholder="search" />
      <div id="chips" class="chips" role="tablist"></div>
      <ul id="poi-list" class="poi-list"></ul>
    </main>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <section id="sheet" class="sheet" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div id="sheet-hero" class="sheet-hero">
        <span id="sheet-art" class="hero-art" aria-hidden="true"></span>
        <span id="sheet-num" class="hero-num" hidden></span>
        <h2 id="sheet-title" class="hero-title"></h2>
      </div>
      <div id="sheet-sub" class="sheet-sub"></div>
      <div id="sheet-schedule" class="sheet-schedule" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        <span class="sched-text"><b data-i18n="schedule">Horario</b> <span id="sheet-times"></span></span>
        <span id="sheet-status" class="status-badge" hidden></span>
      </div>
      <div id="sheet-ecotour" class="eco-run" hidden>
        <b data-i18n="eco.next">Próximo tren</b>
        <ol id="eco-stops"></ol>
      </div>
      <p id="sheet-desc" class="sheet-desc"></p>
      <div class="sheet-actions">
        <button id="sheet-go" class="btn primary" type="button" data-i18n="go">Ir</button>
        <button id="sheet-close" class="btn" type="button" data-i18n="close">Cerrar</button>
      </div>
      <button id="more-hint" class="more-hint" type="button" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 13l6-6 6 6"/><path d="M6 19l6-6 6 6" opacity="0.5"/></svg>
        <span id="more-hint-text"></span>
      </button>
      <section id="sheet-more" class="sheet-more" hidden>
        <h3 data-i18n="more.title">Nuestros animales</h3>
        <div id="iucn" class="iucn"></div>
        <div id="ind-tabs" class="ind-tabs" role="tablist"></div>
        <article id="ind-card" class="ind-card"></article>
      </section>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
